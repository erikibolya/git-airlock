name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="airlock-${GOOS}-${GOARCH}"
          mkdir -p dist
          bin="airlock"
          ldflags="-s -w -X main.version=${VERSION}"
          if [ "$GOOS" = "windows" ]; then
            bin="airlock.exe"
            # Embed PE metadata and keep the symbols: anonymous, stripped
            # binaries score worse with Defender's ML heuristics.
            version="${VERSION#v}"
            # go run builds the generator for the host; GOOS/GOARCH are set to
            # windows for this job, so override them for the tool only.
            GOOS=linux GOARCH=amd64 go run github.com/tc-hib/go-winres@v0.3.3 make --in installer/winres.json --arch "${GOARCH}" --out cmd/airlock/rsrc --product-version "$version" --file-version "$version"
            ldflags="-X main.version=${VERSION}"
          fi
          go build -trimpath -ldflags "$ldflags" -o "dist/${bin}" ./cmd/airlock
          cp README.md LICENSE dist/
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q -r "${name}.zip" "${bin}" README.md LICENSE)
          else
            mv "dist/${bin}" "dist/${name}"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}" README.md LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  # The Wails desktop app needs a Windows toolchain for the icon/manifest that
  # `wails build` generates. The installer reuses that binary.
  desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Stamp desktop version
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "desktop/wails.json"
          $json = Get-Content $path -Raw | ConvertFrom-Json
          $json.info.productVersion = "${{ github.ref_name }}".TrimStart("v")
          [System.IO.File]::WriteAllText($path, ($json | ConvertTo-Json -Depth 10))
      - name: Build desktop app
        working-directory: desktop
        run: wails build -clean -platform windows/amd64 -ldflags "-X main.version=${{ github.ref_name }}"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -SkipDesktop -Version ${{ github.ref_name }}
      - name: Build update manifest
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force dist | Out-Null
          go run ./cmd/updatesign manifest --version $version `
            --installer "installer/dist/GitAirlockSetup-$version.exe" `
            --url "https://github.com/erikibolya/git-airlock/releases/download/v$version/GitAirlockSetup-$version.exe" `
            --notes "See https://github.com/erikibolya/git-airlock/releases/tag/v$version" `
            --out "dist/latest.json"
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/build/bin/airlock-desktop.exe dist/
          Copy-Item installer/dist/GitAirlockSetup-*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-desktop-windows
          path: dist/*

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/airlock-desktop.exe
            dist/GitAirlockSetup-*.exe
            dist/latest.json
            dist/checksums.txt
          generate_release_notes: true
      - name: Add code signing policy to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          footer='**Code signing policy:** free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). Details: [docs/CODE_SIGNING.md](https://github.com/erikibolya/git-airlock/blob/main/docs/CODE_SIGNING.md).'
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$body

          ---

          $footer"
