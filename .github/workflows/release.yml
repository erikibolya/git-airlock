name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="airlock-${GOOS}-${GOARCH}"
          mkdir -p dist
          bin="airlock"
          if [ "$GOOS" = "windows" ]; then
            bin="airlock.exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${bin}" ./cmd/airlock
          cp README.md LICENSE dist/
          if [ "$GOOS" = "windows" ]; then
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
              -o "dist/airlock-desktop.exe" ./cmd/airlock-desktop
            (cd dist && zip -q -r "${name}.zip" "${bin}" airlock-desktop.exe README.md LICENSE)
            (cd dist && zip -q -r "airlock-desktop-windows-amd64.zip" airlock-desktop.exe README.md LICENSE)
          else
            mv "dist/${bin}" "dist/${name}"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}" README.md LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
