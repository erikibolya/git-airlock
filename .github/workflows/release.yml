name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Build and archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="airlock-${GOOS}-${GOARCH}"
          mkdir -p dist
          bin="airlock"
          if [ "$GOOS" = "windows" ]; then
            bin="airlock.exe"
          fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/${bin}" ./cmd/airlock
          cp README.md LICENSE dist/
          if [ "$GOOS" = "windows" ]; then
            (cd dist && zip -q -r "${name}.zip" "${bin}" README.md LICENSE)
          else
            mv "dist/${bin}" "dist/${name}"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}" README.md LICENSE
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  # The Wails desktop app needs a Windows toolchain for the icon/manifest that
  # `wails build` generates. The installer reuses that binary.
  desktop:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build desktop app
        working-directory: desktop
        run: wails build -clean -platform windows/amd64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh
      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -SkipDesktop -Version ${{ github.ref_name }}
      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/build/bin/airlock-desktop.exe dist/
          Copy-Item installer/dist/GitAirlockSetup-*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: airlock-desktop-windows
          path: dist/*

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/airlock-desktop.exe
            dist/GitAirlockSetup-*.exe
            dist/checksums.txt
          generate_release_notes: true
