name: auto-merge

# Auto-merge is deliberately gated on "ready for review", not on a push. A draft PR can receive as
# many commits as the agent needs; only marking it ready enables the merge. GitHub then waits for
# the required checks configured on the protected `dev` branch.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable:
    name: enable auto-merge
    if: >
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (startsWith(github.event.pull_request.head.ref, 'feat/') ||
       startsWith(github.event.pull_request.head.ref, 'fix/') ||
       startsWith(github.event.pull_request.head.ref, 'docs/') ||
       startsWith(github.event.pull_request.head.ref, 'chore/'))
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" = "true" ]; then
            echo "Auto-merge is already enabled for #$PR."
            exit 0
          fi
          gh pr merge --auto --merge --delete-branch "$PR" --repo "$REPO"

      - name: Wait for merge and trigger the dev build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A merge performed with GITHUB_TOKEN does not emit a push workflow
          # event. Wait for the native auto-merge and dispatch the rolling dev
          # build explicitly instead of relying on the push trigger.
          for _ in $(seq 1 120); do
            merged=$(gh pr view "$PR" --repo "$REPO" --json mergedAt --jq '.mergedAt // empty')
            state=$(gh pr view "$PR" --repo "$REPO" --json state --jq '.state')
            if [ -n "$merged" ]; then
              gh workflow run dev-release.yml --ref dev --repo "$REPO"
              echo "Triggered Dev build for the merge of #$PR."
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "PR #$PR closed without merging; not triggering a build."
              exit 1
            fi
            sleep 30
          done
          echo "Timed out waiting for #$PR to merge."
          exit 1
