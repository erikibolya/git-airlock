# Example .airlock.toml. `airlock init` generates this for you.
repo     = "owner/name"
remote   = "company"
mirror   = "~/.airlock/owner-name.git"

# Shared directory, or "git" to keep the queue in refs/airlock/* of the mirror.
queue    = "~/.airlock/queue"

# Optional with queue="git": push/fetch the queue refs over git (ssh://...)
# instead of reading the shared mirror.
# queue_remote = "ssh://host/path/to/.mirrors/owner-name.git"

provider = "gitea"                   # gitea | github | gitlab
api      = "https://gitea.example.com/api/v1"
ca       = ""

# Timeout for network git operations (fetch/push). Default 90s.
# Increase on slow links or WSL 9p mounts, e.g. "5m".
network_timeout = "90s"

base     = "main"
merge    = "when-green"

# GitHub:
# provider = "github"
# api      = ""                       # defaults to https://api.github.com
#
# GitLab:
# provider = "gitlab"
# api      = ""                       # defaults to https://gitlab.com/api/v4
